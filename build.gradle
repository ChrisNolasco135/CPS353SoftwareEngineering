
plugins {
    id 'java'
    id 'application'
    id 'eclipse'
    id 'com.google.protobuf' version '0.9.4'
}

eclipse.project.name = 'CPS353SoftwareEngineering'

application {
    mainClass = 'ServerMain'
}

sourceSets {
    main {
        java {
            srcDirs = [
                'src',
                "$buildDir/generated/source/proto/main/java",
                "$buildDir/generated/source/proto/main/grpc"
            ]
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
    }
}

repositories {
    mavenCentral()
}

def grpcVersion = '1.59.1'
def protobufVersion = '3.25.1'

dependencies {
    implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
    implementation "io.grpc:grpc-protobuf:${grpcVersion}"
    implementation "io.grpc:grpc-stub:${grpcVersion}"
    implementation "com.google.protobuf:protobuf-java:${protobufVersion}"

    // Generated gRPC sources use javax.annotation.Generated.
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    annotationProcessor 'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.10.0'
    testImplementation 'io.grpc:grpc-testing:' + grpcVersion

    implementation 'com.google.code.gson:gson:2.13.1'
    implementation 'fr.inria.gforge.spoon:spoon-core:11.2.0'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }

    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }

    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

tasks.named('compileJava') {
    dependsOn tasks.named('generateProto')
}

tasks.register('runClient', JavaExec) {
    group = 'application'
    description = 'Runs the compute engine frontend client'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'network.ClientMain'

    standardInput = System.in
}

tasks.register('runStorageServer', JavaExec) {
    group = 'application'
    description = 'Runs the independent data store server'

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'StorageServerMain'
}

test {
    useJUnitPlatform()
}
